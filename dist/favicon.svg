<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="24" fill="#08090C"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#border-grad)" stroke-width="2"/>
  
  <!-- Isometric 3D Y Cube Matrix -->
  <!-- Top Face -->
  <polygon points="50,18 78,34 50,50 22,34" fill="url(#top-grad)" opacity="0.9"/>
  <!-- Left Face -->
  <polygon points="22,34 50,50 50,82 22,66" fill="url(#left-grad)" opacity="0.95"/>
  <!-- Right Face -->
  <polygon points="50,50 78,34 78,66 50,82" fill="url(#right-grad)" opacity="0.95"/>
  
  <!-- Inner Y Core Lines -->
  <path d="M50 50 L50 82 M50 50 L22 34 M50 50 L78 34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
  <circle cx="50" cy="50" r="4" fill="#06B6D4"/>
  
  <defs>
    <linearGradient id="top-grad" x1="22" y1="18" x2="78" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="left-grad" x1="22" y1="34" x2="50" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="right-grad" x1="50" y1="34" x2="78" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
</svg>
